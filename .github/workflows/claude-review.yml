# .github/workflows/claude-review.yml
name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --allowedTools "Bash(gh pr comment:*)"
          prompt: |
            Review pull request #${{ github.event.pull_request.number || inputs.pr_number }} in this repository. Focus on:
            1. Security vulnerabilities
            2. Performance regressions
            3. Missing error handling
            4. Test coverage
            5. Documentation accuracy
            Post your review as a PR comment.

      # Uploads the action's own execution log so a run that produces no PR
      # comment can still be diagnosed after the fact (the log is written to
      # a runner-temp path, not the workspace, so it doesn't survive the job
      # otherwise). `if: always()` captures it even when the action step
      # above fails; `if-no-files-found: ignore` keeps a missing log (e.g.
      # the action erroring before it writes one) from failing the job.
      - name: Upload Claude execution log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-output
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore
