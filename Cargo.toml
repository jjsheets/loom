[package]
name = "loom"
version = "0.1.0"
edition = "2024"
description = "A game engine"
license = "MIT"
repository = "https://github.com/jjsheets/loom"

[dependencies]
env_logger = "0.11.11"
pollster = "1.0.1"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
wgpu = "30.0.0"
winit = "0.30.13"
